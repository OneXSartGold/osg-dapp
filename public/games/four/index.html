<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>OSG Four in a Row</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0A1F;--ink:#F4F2FF;--mute:#A9A6C8;--line:rgba(255,255,255,.1);--gold:#F5B83D;--gold2:#FFD97A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;background:radial-gradient(600px 400px at 90% 0%,rgba(167,139,250,.32),transparent 60%),radial-gradient(500px 400px at 0% 50%,rgba(59,130,246,.22),transparent 60%),var(--bg)}
.wrap{max-width:480px;margin:0 auto;padding:0 14px 28px}
header{display:flex;align-items:center;gap:10px;padding:14px 0}
header img{width:34px;height:34px}
header b{font-weight:900;font-size:19px}
header b i{font-style:normal;color:var(--gold2)}
header .sp{margin-left:auto}
header a,header button{font:700 13px Inter,sans-serif;text-decoration:none;color:var(--ink);background:none;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.trial{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.16em;color:#120E2E;background:linear-gradient(90deg,var(--gold2),var(--gold));padding:5px 11px;border-radius:999px}
h1{font-size:28px;font-weight:900;margin:8px 0 2px}
.sub{color:var(--mute);font-size:13.5px;margin-bottom:12px;line-height:1.45}
.hud{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:7px;margin-bottom:10px}
.box{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:7px 9px;min-width:0}
.box small{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--mute);font-weight:800}
.box b{font-size:18px;font-weight:900;display:inline-block;white-space:nowrap}
.gold{color:var(--gold2)}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.3)}}
.btn{border:0;border-radius:12px;padding:12px 20px;font:800 15px Inter,sans-serif;background:linear-gradient(90deg,var(--gold2),var(--gold));color:#120E2E;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line)}
.float{position:fixed;pointer-events:none;font-weight:900;font-size:22px;color:var(--gold2);text-shadow:0 2px 10px rgba(0,0,0,.6);animation:up 1s ease-out forwards;z-index:30}
@keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.spark{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:29}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;white-space:nowrap;pointer-events:none;z-index:31;text-shadow:0 4px 24px rgba(0,0,0,.75);animation:ban 1.3s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,7,26,.78);backdrop-filter:blur(3px);z-index:40;padding:20px}
.modal .in{width:min(360px,100%);background:#15123A;border:1px solid rgba(167,139,250,.35);border-radius:20px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:min .3s ease-out}
@keyframes min{from{transform:scale(.85);opacity:0}}
.modal h3{font-size:16px;color:var(--mute);font-weight:700}
.modal .big{display:block;font-size:38px;font-weight:900;color:var(--gold2);margin:6px 0}
.modal p{color:var(--mute);font-size:13.5px;line-height:1.6}
.modal .acts{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
footer{color:var(--mute);font-size:11.5px;line-height:1.55;margin-top:20px;border-top:1px solid var(--line);padding-top:14px}

.lv{display:flex;gap:7px;margin-bottom:10px}
.lv button{flex:1;padding:9px;font-size:13px}
.lv button.on{background:linear-gradient(90deg,var(--gold2),var(--gold));color:#120E2E;border:0}
.turn{text-align:center;font-weight:800;font-size:14px;margin-bottom:10px;color:var(--mute)}
.turn b{color:var(--gold2)}
.fb{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;border-radius:18px;background:linear-gradient(160deg,#3B2A8C,#1E1B6B);border:2px solid rgba(167,139,250,.45);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.15);user-select:none;touch-action:manipulation}
.fc{aspect-ratio:1;border-radius:50%;background:#0B0A1F;box-shadow:inset 0 3px 6px rgba(0,0,0,.6);position:relative;cursor:pointer;overflow:visible}
.disc{position:absolute;inset:2px;border-radius:50%}
.disc.p{background:radial-gradient(circle at 35% 30%,#FFF3C4,#F5B83D 55%,#B45309);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.disc.p:after{content:"";position:absolute;inset:26%;border-radius:50%;border:2px solid rgba(146,64,14,.35)}
.disc.a{background:radial-gradient(circle at 35% 30%,#F5D0FE,#A855F7 55%,#6B21A8);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.disc.drop{animation:drop var(--dt) cubic-bezier(.5,0,.7,1.4)}
@keyframes drop{from{transform:translateY(var(--dy))}}
.disc.win{animation:winp .7s infinite;box-shadow:0 0 0 3px #fff,0 0 18px #fff}
@keyframes winp{50%{transform:scale(.82)}}
.fc.hov{background:#1a1640}
</style></head><body><div class="wrap">
<header><img src="../logo.png" alt="OSG logo"><b>OSG <i>Games</i></b><span class="sp"></span><button id="snd" type="button">🔊</button><a href="../">← All games</a></header>
<span class="trial">FREE TRIAL</span>
<h1>OSG Four in a Row</h1>
<p class="sub">Drop your gold coins and get four in a row before the computer does.</p>
<div class="lv" id="lv"><button class="btn ghost" data-d="1" type="button">Easy</button><button class="btn ghost on" data-d="3" type="button">Medium</button><button class="btn ghost" data-d="5" type="button">Hard</button></div>
<div class="hud"><div class="box"><small>SCORE</small><b id="score" class="gold">0</b></div><div class="box"><small>WINS</small><b id="wins">0</b></div><div class="box"><small>LOSSES</small><b id="losses">0</b></div></div>
<div class="turn" id="turn">Your turn: <b>tap a column</b></div>
<div class="fb" id="fb"></div>

<footer>Trial version: no login, nothing is saved to a server. Free to play: no betting, no paid entry, no prizes. Points are for fun only.</footer>
</div>
<div class="modal" id="modal"></div>
<script>
var sound=true,actx=null;
function $(i){return document.getElementById(i);}
function tone(freqs,dur,type,vol){
  if(!sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var t=actx.currentTime;
    freqs.forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*dur);g.gain.exponentialRampToValueAtTime(vol||0.16,t+i*dur+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+(i+1)*dur);
      o.connect(g);g.connect(actx.destination);o.start(t+i*dur);o.stop(t+(i+1)*dur+0.02);});
  }catch(e){}
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function floatText(x,y,txt,color,size){var d=document.createElement("div");d.className="float";d.textContent=txt;d.style.left=x+"px";d.style.top=y+"px";if(color)d.style.color=color;if(size)d.style.fontSize=size+"px";document.body.appendChild(d);setTimeout(function(){d.remove();},1000);}
function sparks(x,y,n,cols){
  cols=cols||["#FFD97A","#F5B83D","#A78BFA","#60A5FA","#34D399","#F472B6"];
  for(var i=0;i<n;i++){(function(i){var s=document.createElement("div");s.className="spark";s.style.background=cols[i%cols.length];s.style.left=x+"px";s.style.top=y+"px";document.body.appendChild(s);
    var a=Math.random()*Math.PI*2,v=40+Math.random()*80;
    if(s.animate)s.animate([{transform:"translate(0,0)",opacity:1},{transform:"translate("+Math.cos(a)*v+"px,"+(Math.sin(a)*v+30)+"px) rotate("+(Math.random()*540)+"deg)",opacity:0}],{duration:600+Math.random()*400,easing:"cubic-bezier(.2,.7,.4,1)"});
    setTimeout(function(){s.remove();},1050);})(i);}
}
function banner(txt,color){var d=document.createElement("div");d.className="banner";d.textContent=txt;d.style.color=color||"#FFD97A";document.body.appendChild(d);setTimeout(function(){d.remove();},1300);}
function confetti(){for(var k=0;k<6;k++)setTimeout(function(){sparks(Math.random()*window.innerWidth,window.innerHeight*0.35,16);},k*150);}
function getBest(k){try{return Number(localStorage.getItem(k))||0;}catch(e){return 0;}}
function setBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}
function fmt(n){return Number(n).toLocaleString("en-US");}
function rollTo(el,from,to){var t0=performance.now();(function step(now){var k=Math.min(1,(now-t0)/400);el.textContent=fmt(Math.round(from+(to-from)*k));if(k<1)requestAnimationFrame(step);})(t0);bump(el);}
function center(el){var r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}
function modal(html,actions){
  var m=$("modal");m.innerHTML='<div class="in">'+html+'<div class="acts"></div></div>';
  var a=m.querySelector(".acts");
  actions.forEach(function(x){var b=document.createElement("button");b.className="btn"+(x.ghost?" ghost":"");b.textContent=x.label;b.onclick=function(){m.style.display="none";x.fn&&x.fn();};a.appendChild(b);});
  m.style.display="flex";
}
function closeModal(){$("modal").style.display="none";}
$("snd").onclick=function(){sound=!sound;this.textContent=sound?"🔊":"🔇";};

// Scoring (fun only): win = 300 (easy) / 600 (medium) / 1,000 (hard)
// + bonus for a quick win, draw = 100. Score adds up across games.
var R=6,C=7,bd,busy,depth=3,score=0,wins=0,losses=0,over,movesN;
function cell(r,c){return $("fb").children[r*C+c];}
function draw0(){var fb=$("fb");fb.innerHTML="";for(var r=0;r<R;r++)for(var c=0;c<C;c++){(function(c){var d=document.createElement("div");d.className="fc";d.onclick=function(){play(c);};fb.appendChild(d);})(c);}}
function newGame(){bd=[];for(var r=0;r<R;r++)bd.push(new Array(C).fill(0));busy=false;over=false;movesN=0;draw0();$("turn").innerHTML="Your turn: <b>tap a column</b>";}
function lowest(b,c){for(var r=R-1;r>=0;r--)if(!b[r][c])return r;return -1;}
function put(r,c,who){var el=cell(r,c),d=document.createElement("div");d.className="disc "+(who===1?"p":"a")+" drop";var h=el.getBoundingClientRect().height+6;d.style.setProperty("--dy",(-(r+1)*h)+"px");d.style.setProperty("--dt",(0.18+r*0.05)+"s");el.appendChild(d);
  setTimeout(function(){tone([who===1?520:400],0.05,"triangle",0.1);buzz(10);},(180+r*50));}
function winLine(b,who){var dirs=[[0,1],[1,0],[1,1],[1,-1]];for(var r=0;r<R;r++)for(var c=0;c<C;c++){if(b[r][c]!==who)continue;for(var k=0;k<4;k++){var line=[[r,c]],ok=true;for(var s=1;s<4;s++){var rr=r+dirs[k][0]*s,cc=c+dirs[k][1]*s;if(rr<0||rr>=R||cc<0||cc>=C||b[rr][cc]!==who){ok=false;break;}line.push([rr,cc]);}if(ok)return line;}}return null;}
function full(b){return b[0].every(function(x){return x!==0;});}
function scoreWin(w,who){var s=0,o=3-who,cnt=0,emp=0,opp=0;for(var i=0;i<4;i++){if(w[i]===who)cnt++;else if(w[i]===0)emp++;else opp++;}
  if(cnt===4)s+=1000;else if(cnt===3&&emp===1)s+=6;else if(cnt===2&&emp===2)s+=2;
  var oc=0,oe=0;for(var j=0;j<4;j++){if(w[j]===o)oc++;else if(w[j]===0)oe++;}if(oc===3&&oe===1)s-=8;return s;}
function evalB(b,who){var s=0;for(var r=0;r<R;r++)if(b[r][3]===who)s+=3;
  for(var r2=0;r2<R;r2++)for(var c=0;c<C-3;c++)s+=scoreWin([b[r2][c],b[r2][c+1],b[r2][c+2],b[r2][c+3]],who);
  for(var c2=0;c2<C;c2++)for(var r3=0;r3<R-3;r3++)s+=scoreWin([b[r3][c2],b[r3+1][c2],b[r3+2][c2],b[r3+3][c2]],who);
  for(var r4=0;r4<R-3;r4++)for(var c4=0;c4<C-3;c4++){s+=scoreWin([b[r4][c4],b[r4+1][c4+1],b[r4+2][c4+2],b[r4+3][c4+3]],who);s+=scoreWin([b[r4+3][c4],b[r4+2][c4+1],b[r4+1][c4+2],b[r4][c4+3]],who);}
  return s;}
var ORDER=[3,2,4,1,5,0,6];
function minimax(b,d,a,be,max){
  if(winLine(b,2))return 100000+d;if(winLine(b,1))return -100000-d;if(full(b))return 0;if(d===0)return evalB(b,2);
  if(max){var v=-Infinity;for(var i=0;i<7;i++){var c=ORDER[i],r=lowest(b,c);if(r<0)continue;b[r][c]=2;v=Math.max(v,minimax(b,d-1,a,be,false));b[r][c]=0;a=Math.max(a,v);if(a>=be)break;}return v;}
  var v2=Infinity;for(var j=0;j<7;j++){var c2=ORDER[j],r2=lowest(b,c2);if(r2<0)continue;b[r2][c2]=1;v2=Math.min(v2,minimax(b,d-1,a,be,true));b[r2][c2]=0;be=Math.min(be,v2);if(a>=be)break;}return v2;}
function aiMove(){
  var best=-Infinity,choice=[];
  for(var i=0;i<7;i++){var c=ORDER[i],r=lowest(bd,c);if(r<0)continue;bd[r][c]=2;var v=minimax(bd,depth-1,-Infinity,Infinity,false);bd[r][c]=0;
    if(depth===1)v+=Math.random()*40-20;
    if(v>best){best=v;choice=[c];}else if(v===best)choice.push(c);}
  return choice[Math.floor(Math.random()*choice.length)];
}
function play(c){
  if(busy||over)return;var r=lowest(bd,c);if(r<0){tone([180],0.05,"square",0.03);return;}
  busy=true;bd[r][c]=1;movesN++;put(r,c,1);
  setTimeout(function(){
    if(end(1))return;
    $("turn").innerHTML="Computer is thinking… 🤔";
    setTimeout(function(){var ac=aiMove(),ar=lowest(bd,ac);bd[ar][ac]=2;put(ar,ac,2);
      setTimeout(function(){if(end(2))return;busy=false;$("turn").innerHTML="Your turn: <b>tap a column</b>";},250+ar*50);},350);
  },250+r*50);
}
function end(who){
  var line=winLine(bd,who);
  if(line){over=true;line.forEach(function(p){var d=cell(p[0],p[1]).querySelector(".disc");if(d){d.classList.remove("drop");d.classList.add("win");}});
    if(who===1){wins++;$("wins").textContent=wins;var base=depth>=5?1000:depth>=3?600:300,quick=Math.max(0,(21-movesN)*20),pts=base+quick,from=score;score+=pts;rollTo($("score"),from,score);
      var p=center($("fb"));floatText(p[0],p[1],"+"+fmt(pts),null,30);confetti();tone([523,659,784,1047],0.12,"sine",0.2);buzz([40,60,40]);banner("🏆 You win!");
      var bk="osgFourBest",b=getBest(bk);if(score>b)setBest(bk,score);
      setTimeout(function(){modal('<h3>You win! 🎉</h3><span class="big">+'+fmt(pts)+'</span><p>Total score '+fmt(score)+'. Wins '+wins+' · Losses '+losses+'</p>',[{label:"Play again",fn:newGame}]);},1300);}
    else{losses++;$("losses").textContent=losses;tone([330,262,196],0.13,"triangle",0.1);buzz([60,40,60]);banner("Computer wins","#C084FC");
      setTimeout(function(){modal('<h3>The computer won this time</h3><span class="big">'+fmt(score)+'</span><p>Total score. Wins '+wins+' · Losses '+losses+'</p>',[{label:"Try again",fn:newGame},{label:"Easier level",ghost:true,fn:function(){setLevel(Math.max(1,depth-2));}}]);},1300);}
    $("turn").innerHTML=who===1?"<b>Four in a row! 🎉</b>":"Computer got four in a row";return true;}
  if(full(bd)){over=true;var from2=score;score+=100;rollTo($("score"),from2,score);banner("Draw! +100","#60A5FA");setTimeout(function(){modal('<h3>It\'s a draw</h3><span class="big">+100</span><p>Total score '+fmt(score)+'</p>',[{label:"Play again",fn:newGame}]);},900);return true;}
  return false;
}
function setLevel(d){depth=d;$("lv").querySelectorAll("button").forEach(function(x){x.classList.toggle("on",Number(x.dataset.d)===d);});newGame();}
$("lv").querySelectorAll("button").forEach(function(b){b.onclick=function(){setLevel(Number(b.dataset.d));};});
newGame();
</script></body></html>
