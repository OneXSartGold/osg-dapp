<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>OSG Sudoku</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0A1F;--ink:#F4F2FF;--mute:#A9A6C8;--line:rgba(255,255,255,.1);--gold:#F5B83D;--gold2:#FFD97A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;background:radial-gradient(600px 400px at 90% 0%,rgba(16,185,129,.25),transparent 60%),radial-gradient(500px 400px at 0% 50%,rgba(59,130,246,.22),transparent 60%),var(--bg)}
.wrap{max-width:480px;margin:0 auto;padding:0 14px 28px}
header{display:flex;align-items:center;gap:10px;padding:14px 0}
header img{width:34px;height:34px}
header b{font-weight:900;font-size:19px}
header b i{font-style:normal;color:var(--gold2)}
header .sp{margin-left:auto}
header a,header button{font:700 13px Inter,sans-serif;text-decoration:none;color:var(--ink);background:none;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.trial{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.16em;color:#120E2E;background:linear-gradient(90deg,var(--gold2),var(--gold));padding:5px 11px;border-radius:999px}
h1{font-size:28px;font-weight:900;margin:8px 0 2px}
.sub{color:var(--mute);font-size:13.5px;margin-bottom:12px;line-height:1.45}
.hud{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:7px;margin-bottom:10px}
.box{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:7px 9px;min-width:0}
.box small{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--mute);font-weight:800}
.box b{font-size:18px;font-weight:900;display:inline-block;white-space:nowrap}
.gold{color:var(--gold2)}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.3)}}
.btn{border:0;border-radius:12px;padding:12px 20px;font:800 15px Inter,sans-serif;background:linear-gradient(90deg,var(--gold2),var(--gold));color:#120E2E;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line)}
.float{position:fixed;pointer-events:none;font-weight:900;font-size:22px;color:var(--gold2);text-shadow:0 2px 10px rgba(0,0,0,.6);animation:up 1s ease-out forwards;z-index:30}
@keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.spark{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:29}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;white-space:nowrap;pointer-events:none;z-index:31;text-shadow:0 4px 24px rgba(0,0,0,.75);animation:ban 1.3s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,7,26,.78);backdrop-filter:blur(3px);z-index:40;padding:20px}
.modal .in{width:min(360px,100%);background:#15123A;border:1px solid rgba(167,139,250,.35);border-radius:20px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:min .3s ease-out}
@keyframes min{from{transform:scale(.85);opacity:0}}
.modal h3{font-size:16px;color:var(--mute);font-weight:700}
.modal .big{display:block;font-size:38px;font-weight:900;color:var(--gold2);margin:6px 0}
.modal p{color:var(--mute);font-size:13.5px;line-height:1.6}
.modal .acts{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
footer{color:var(--mute);font-size:11.5px;line-height:1.55;margin-top:20px;border-top:1px solid var(--line);padding-top:14px}

.lv{display:flex;gap:7px;margin-bottom:10px}
.lv button{flex:1;padding:9px;font-size:13px}
.lv button.on{background:linear-gradient(90deg,var(--gold2),var(--gold));color:#120E2E;border:0}
.sg{display:grid;grid-template-columns:repeat(9,1fr);background:#0F0D29;border:2px solid rgba(255,217,122,.55);border-radius:12px;overflow:hidden;user-select:none}
.sc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(5.6vw,24px);font-weight:700;border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;color:#93C5FD;transition:background .15s}
.sc.given{color:#F4F2FF;font-weight:900}
.sc.c3{border-right:2px solid rgba(255,217,122,.45)}
.sc.r3{border-bottom:2px solid rgba(255,217,122,.45)}
.sc.peer{background:rgba(139,92,246,.12)}
.sc.same{background:rgba(96,165,250,.28)}
.sc.sel{background:rgba(245,184,61,.35)}
.sc.bad{color:#F87171;animation:shk .35s}
@keyframes shk{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.sc.ok{animation:okA .35s}
@keyframes okA{50%{transform:scale(1.25);color:#34D399}}
.sc.wave{animation:wave .6s}
@keyframes wave{40%{background:rgba(52,211,153,.45)}}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.pad button{position:relative;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:900 20px Inter,sans-serif;cursor:pointer}
.pad button small{position:absolute;right:6px;top:3px;font-size:9.5px;color:var(--mute);font-weight:700}
.pad button.done{opacity:.25}
.pad button.er{font-size:14px}
.hearts{letter-spacing:2px}
</style></head><body><div class="wrap">
<header><img src="../logo.png" alt="OSG logo"><b>OSG <i>Games</i></b><span class="sp"></span><button id="snd" type="button">🔊</button><a href="../">← All games</a></header>
<span class="trial">FREE TRIAL</span>
<h1>OSG Sudoku</h1>
<p class="sub">Fill every row, column and 3×3 box with 1 to 9. Three mistakes and the game ends.</p>
<div class="lv" id="lv"><button class="btn ghost on" data-n="38" type="button">Easy</button><button class="btn ghost" data-n="46" type="button">Medium</button><button class="btn ghost" data-n="52" type="button">Hard</button></div>
<div class="hud"><div class="box"><small>SCORE</small><b id="score" class="gold">0</b></div><div class="box"><small>TIME</small><b id="time">0:00</b></div><div class="box"><small>LIVES</small><b id="lives" class="hearts">❤️❤️❤️</b></div></div>
<div class="sg" id="sg"></div>
<div class="pad" id="pad"></div>

<footer>Trial version: no login, nothing is saved to a server. Free to play: no betting, no paid entry, no prizes. Points are for fun only.</footer>
</div>
<div class="modal" id="modal"></div>
<script>
var sound=true,actx=null;
function $(i){return document.getElementById(i);}
function tone(freqs,dur,type,vol){
  if(!sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var t=actx.currentTime;
    freqs.forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*dur);g.gain.exponentialRampToValueAtTime(vol||0.16,t+i*dur+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+(i+1)*dur);
      o.connect(g);g.connect(actx.destination);o.start(t+i*dur);o.stop(t+(i+1)*dur+0.02);});
  }catch(e){}
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function floatText(x,y,txt,color,size){var d=document.createElement("div");d.className="float";d.textContent=txt;d.style.left=x+"px";d.style.top=y+"px";if(color)d.style.color=color;if(size)d.style.fontSize=size+"px";document.body.appendChild(d);setTimeout(function(){d.remove();},1000);}
function sparks(x,y,n,cols){
  cols=cols||["#FFD97A","#F5B83D","#A78BFA","#60A5FA","#34D399","#F472B6"];
  for(var i=0;i<n;i++){(function(i){var s=document.createElement("div");s.className="spark";s.style.background=cols[i%cols.length];s.style.left=x+"px";s.style.top=y+"px";document.body.appendChild(s);
    var a=Math.random()*Math.PI*2,v=40+Math.random()*80;
    if(s.animate)s.animate([{transform:"translate(0,0)",opacity:1},{transform:"translate("+Math.cos(a)*v+"px,"+(Math.sin(a)*v+30)+"px) rotate("+(Math.random()*540)+"deg)",opacity:0}],{duration:600+Math.random()*400,easing:"cubic-bezier(.2,.7,.4,1)"});
    setTimeout(function(){s.remove();},1050);})(i);}
}
function banner(txt,color){var d=document.createElement("div");d.className="banner";d.textContent=txt;d.style.color=color||"#FFD97A";document.body.appendChild(d);setTimeout(function(){d.remove();},1300);}
function confetti(){for(var k=0;k<6;k++)setTimeout(function(){sparks(Math.random()*window.innerWidth,window.innerHeight*0.35,16);},k*150);}
function getBest(k){try{return Number(localStorage.getItem(k))||0;}catch(e){return 0;}}
function setBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}
function fmt(n){return Number(n).toLocaleString("en-US");}
function rollTo(el,from,to){var t0=performance.now();(function step(now){var k=Math.min(1,(now-t0)/400);el.textContent=fmt(Math.round(from+(to-from)*k));if(k<1)requestAnimationFrame(step);})(t0);bump(el);}
function center(el){var r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}
function modal(html,actions){
  var m=$("modal");m.innerHTML='<div class="in">'+html+'<div class="acts"></div></div>';
  var a=m.querySelector(".acts");
  actions.forEach(function(x){var b=document.createElement("button");b.className="btn"+(x.ghost?" ghost":"");b.textContent=x.label;b.onclick=function(){m.style.display="none";x.fn&&x.fn();};a.appendChild(b);});
  m.style.display="flex";
}
function closeModal(){$("modal").style.display="none";}
$("snd").onclick=function(){sound=!sound;this.textContent=sound?"🔊":"🔇";};

// Scoring (fun only): correct number +50 (x2 with a streak of 3+),
// each finished row / column / box +100, finish bonus by speed.
var sol,cur,giv,selI=-1,score,lives,t0,clock,streak,holes=38,over;
function solveCount(g,limit){
  var rows=new Array(9).fill(0),cols=new Array(9).fill(0),box=new Array(9).fill(0),cnt=0;
  for(var i=0;i<81;i++)if(g[i]){var b=1<<g[i];rows[(i/9)|0]|=b;cols[i%9]|=b;box[(((i/27)|0)*3)+(((i%9)/3)|0)]|=b;}
  (function rec(){
    if(cnt>=limit)return;var best=-1,bm=0,bc=10;
    for(var i=0;i<81;i++)if(!g[i]){var r=(i/9)|0,c=i%9,bx=((r/3)|0)*3+((c/3)|0),m=~(rows[r]|cols[c]|box[bx])&0x3FE,n=0;for(var x=m;x;x&=x-1)n++;if(n<bc){bc=n;best=i;bm=m;if(n<=1)break;}}
    if(best<0){cnt++;return;}
    var r2=(best/9)|0,c2=best%9,b2=((r2/3)|0)*3+((c2/3)|0);
    var ds=[];for(var d=1;d<=9;d++)if(bm&(1<<d))ds.push(d);
    if(limit===1)ds.sort(function(){return Math.random()-0.5;});
    for(var k=0;k<ds.length&&cnt<limit;k++){var dd=ds[k],bit=1<<dd;g[best]=dd;rows[r2]|=bit;cols[c2]|=bit;box[b2]|=bit;rec();if(cnt>=limit&&limit===1)return;g[best]=0;rows[r2]&=~bit;cols[c2]&=~bit;box[b2]&=~bit;}
  })();
  return cnt;
}
function generate(n){
  var full=new Array(81).fill(0);solveCount(full,1);
  var puz=full.slice(),order=[];for(var i=0;i<81;i++)order.push(i);order.sort(function(){return Math.random()-0.5;});
  var removed=0;
  for(var k=0;k<81&&removed<n;k++){var i2=order[k],keep=puz[i2];puz[i2]=0;if(solveCount(puz.slice(),2)!==1)puz[i2]=keep;else removed++;}
  return {sol:full,puz:puz};
}
function peers(i){var r=(i/9)|0,c=i%9,br=r-r%3,bc=c-c%3,p=[];for(var j=0;j<81;j++){var rr=(j/9)|0,cc=j%9;if(rr===r||cc===c||(rr>=br&&rr<br+3&&cc>=bc&&cc<bc+3))p.push(j);}return p;}
function cellEl(i){return $("sg").children[i];}
function render(){
  var g=$("sg");g.innerHTML="";
  for(var i=0;i<81;i++){(function(i){var d=document.createElement("div");d.className="sc"+(giv[i]?" given":"")+((i%9)%3===2&&i%9!==8?" c3":"")+((((i/9)|0)%3===2)&&((i/9)|0)!==8?" r3":"");d.textContent=cur[i]||"";d.onclick=function(){select(i);};g.appendChild(d);})(i);}
  highlight();pad();
}
function highlight(){
  for(var i=0;i<81;i++)cellEl(i).classList.remove("sel","peer","same");
  if(selI<0)return;peers(selI).forEach(function(j){cellEl(j).classList.add("peer");});
  var v=cur[selI];if(v)for(var j=0;j<81;j++)if(cur[j]===v)cellEl(j).classList.add("same");
  cellEl(selI).classList.add("sel");
}
function select(i){if(over)return;selI=i;highlight();tone([500],0.03,"triangle",0.04);}
function pad(){
  var p=$("pad");p.innerHTML="";
  for(var d=1;d<=9;d++){(function(d){var left=9-cur.filter(function(x){return x===d;}).length;var b=document.createElement("button");b.type="button";b.innerHTML=d+(left?"<small>"+left+"</small>":"");if(!left)b.className="done";b.onclick=function(){put(d);};p.appendChild(b);})(d);}
  var e=document.createElement("button");e.type="button";e.className="er";e.textContent="⌫ Erase";e.onclick=function(){if(selI>=0&&!giv[selI]&&cur[selI]!==sol[selI]){cur[selI]=0;cellEl(selI).textContent="";cellEl(selI).classList.remove("bad");highlight();}};p.appendChild(e);
}
function groupDone(list){return list.every(function(j){return cur[j]===sol[j];});}
function put(d){
  if(over||selI<0||giv[selI]||cur[selI]===sol[selI])return;
  if(!t0){t0=Date.now();clock=setInterval(tick,500);}
  var el=cellEl(selI),p=center(el);
  if(sol[selI]!==d){
    cur[selI]=d;el.textContent=d;el.classList.remove("bad");void el.offsetWidth;el.classList.add("bad");streak=0;
    lives--;$("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);bump($("lives"));tone([200,160],0.08,"square",0.05);buzz([20,40,20]);
    if(lives<=0)lose();return;
  }
  cur[selI]=d;el.textContent=d;el.classList.remove("bad","ok");void el.offsetWidth;el.classList.add("ok");streak++;
  var pts=streak>=3?100:50,r=(selI/9)|0,c=selI%9,br=r-r%3,bc=c-c%3;
  var row=[],col=[],box=[];for(var k=0;k<9;k++){row.push(r*9+k);col.push(k*9+c);}for(var a=0;a<3;a++)for(var b=0;b<3;b++)box.push((br+a)*9+bc+b);
  var groups=[row,col,box].filter(groupDone);
  groups.forEach(function(gp,gi){gp.forEach(function(j,ix){setTimeout(function(){var e=cellEl(j);e.classList.remove("wave");void e.offsetWidth;e.classList.add("wave");},ix*40+gi*120);});});
  pts+=groups.length*100;
  var from=score;score+=pts;rollTo($("score"),from,score);floatText(p[0],p[1]-14,"+"+pts,groups.length?"#34D399":null);
  tone(groups.length?[660,880,1100]:[660,880],0.06,"sine",0.15);buzz(12);
  if(groups.length){sparks(p[0],p[1],12);banner(groups.length>1?"⚡ Double complete!":"Line complete!",groups.length>1?"#FB923C":"#34D399");}
  else if(streak===3)banner("🔥 Streak x2 points","#F472B6");
  highlight();pad();
  if(cur.every(function(x,i){return x===sol[i];}))win();
}
function tick(){var s=Math.floor((Date.now()-t0)/1000);$("time").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function win(){over=true;clearInterval(clock);var s=Math.floor((Date.now()-t0)/1000),bonus=Math.max(500,3000-s*3)*(holes>=52?2:holes>=46?1.5:1);bonus=Math.round(bonus);
  confetti();tone([523,659,784,1047],0.12,"sine",0.2);banner("🏆 Solved!");
  setTimeout(function(){var from=score;score+=bonus;rollTo($("score"),from,score);var bk="osgSudokuBest",b=getBest(bk),nb=score>b;if(nb)setBest(bk,score);
    modal('<h3>Puzzle solved in '+$("time").textContent+'</h3><span class="big">'+fmt(score)+'</span><p>Speed bonus +'+fmt(bonus)+'. '+(nb?"New best on this device! 🎉":"Best: "+fmt(b))+'</p>',[{label:"New puzzle",fn:start}]);},900);}
function lose(){over=true;clearInterval(clock);
  setTimeout(function(){modal('<h3>Out of lives 💔</h3><span class="big">'+fmt(score)+'</span><p>Three mistakes. Try again, you can do it!</p>',[{label:"New puzzle",fn:start},{label:"Show answer",ghost:true,fn:function(){cur=sol.slice();render();}}]);},500);}
function start(){
  var g=generate(holes);sol=g.sol;cur=g.puz.slice();giv=g.puz.map(function(x){return x>0;});
  selI=-1;score=0;lives=3;t0=0;streak=0;over=false;clearInterval(clock);$("score").textContent="0";$("time").textContent="0:00";$("lives").textContent="❤️❤️❤️";render();
}
$("lv").querySelectorAll("button").forEach(function(b){b.onclick=function(){$("lv").querySelectorAll("button").forEach(function(x){x.classList.remove("on");});b.classList.add("on");holes=Number(b.dataset.n);start();};});
document.addEventListener("keydown",function(e){if(/^[1-9]$/.test(e.key))put(Number(e.key));});
start();
</script></body></html>
