<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOSG Discussion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>

/* Layout: one reading column. Header, topic index (each topic is a dated discussion item), topic sections, change log. Single dark theme to match the OSG partner page. */
:root{
  --bg:#0B0A08; --panel:#15130F; --panel2:#1D1A14; --line:rgba(233,185,73,.16);
  --gold:#E9B949; --fg:#F6F1E6; --muted:#A79F8C; --faint:#6F6857;
  --ok:#46D08A; --ok-bg:rgba(70,208,138,.13); --part:#E9B949; --part-bg:rgba(233,185,73,.14);
  --open:#F2776B; --open-bg:rgba(242,119,107,.14); --later:#A79F8C; --later-bg:rgba(167,159,140,.14);
  --display:"Bricolage Grotesque","Mukta",Georgia,serif;
  --body:"Hanken Grotesk","Mukta",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);margin:0}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:30px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(32px,7vw,46px);line-height:1.1;font-weight:800}
h1 span{color:var(--gold)}
h2{font-size:24px;font-weight:700;line-height:1.3}
h3{font-size:18px;font-weight:700;margin-top:6px}
.eyebrow{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.lede{color:var(--muted);max-width:62ch;margin:8px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
/* topic index */
.topics{list-style:none;margin:0;padding:0}
.topics li a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;color:var(--fg);text-decoration:none;border-top:1px solid var(--line)}
.topics li:first-child a{border-top:0}
.topics li a:hover{background:var(--panel2)}
.topics .tn{font:600 13px var(--mono);color:var(--gold)}
.topics .tt{font-weight:600;min-width:0}
.topics .td{font:500 12px var(--mono);color:var(--faint);white-space:nowrap}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* topic section */
.topic{display:grid;gap:14px;scroll-margin-top:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px;font:500 12px var(--mono);color:var(--faint)}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.f{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:10px 6px;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center}
.f .n{font:800 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.f .l{font-size:13px;color:var(--muted)}
.f[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2)}
.f.ok .n{color:var(--ok)} .f.part .n{color:var(--part)} .f.open .n{color:var(--open)}
ol.sec{list-style:none;padding:0;margin:0}
ol.sec li{display:grid;grid-template-columns:36px 1fr;gap:4px 10px;padding:14px 14px 14px 12px;border-top:1px solid var(--line)}
ol.sec li:first-child{border-top:0}
.no{font:600 14px var(--mono);color:var(--gold);padding-top:3px}
.body{min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px}
.t{font-weight:700;font-size:17px}
.pill{font-size:12.5px;font-weight:600;padding:1px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.part{color:var(--part);background:var(--part-bg)}
.pill.open{color:var(--open);background:var(--open-bg)} .pill.later{color:var(--later);background:var(--later-bg)}
.pts{margin:4px 0 6px}
.src{display:flex;flex-wrap:wrap;gap:6px}
.src span{font:500 11.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.empty{padding:18px;color:var(--muted);text-align:center;display:block!important}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;border-top:0}
td:first-child{font-weight:600}
.ver{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.ver div{padding:14px}
.ver b{font:600 14px var(--mono);color:var(--gold)}
.ver p{margin:4px 0 0}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log time{font:500 12.5px var(--mono);color:var(--gold);padding-top:2px}
footer{color:var(--faint);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:440px){.filters{grid-template-columns:repeat(2,1fr)}.log li{grid-template-columns:1fr;gap:0}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

[hidden]{display:none!important}
/* login gate */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 22px;display:grid;gap:14px}
.gate h1{font-size:34px}
.gate p{margin:0;color:var(--muted);font-size:14.5px}
.gate label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.gate input[type=text],.gate input[type=password]{font:500 16px var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
.gate input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.gate .rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.gate .rem input{width:18px;height:18px;accent-color:var(--gold)}
.gate button{font:700 16px var(--body);color:#1a1405;background:var(--gold);border:0;border-radius:10px;padding:13px;cursor:pointer}
.gate button:disabled{opacity:.6;cursor:wait}
.gate .err{color:var(--open);font-size:14px;min-height:1.4em}
.out{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));font:600 12.5px var(--body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;z-index:5}
</style></head>
<body>
<div class="gate" id="gate">
  <form id="login" autocomplete="on">
    <div class="eyebrow">OneX Smart Chain</div>
    <h1><span>BOSG</span> Discussion</h1>
    <p>This page is for invited people only. Enter the ID and password you were given.</p>
    <label for="uid">ID<input type="text" id="uid" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label for="upw">Password<input type="password" id="upw" name="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required></label>
    <label class="rem" for="rem"><input type="checkbox" id="rem">Remember me on this device</label>
    <button type="submit" id="go">Open</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>
<button class="out" id="out" type="button" hidden>Log out</button>

const SK="bosg-k-"+P.v;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ub64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const subtle=crypto.subtle;
async function sha(s){return ub64(await subtle.digest("SHA-256",enc.encode(s)))}
async function openWith(raw){
  const k=await subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},k,b64(P.ct));
  const c=JSON.parse(dec.decode(pt));
  const app=document.getElementById("app");
  app.innerHTML=c.html;
  document.getElementById("gate").hidden=true;app.hidden=false;document.getElementById("out").hidden=false;
  const s=document.createElement("script");s.textContent=c.js;document.body.appendChild(s);
  if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}
}
async function unwrap(id,pw){
  const h=await sha("bosg-id:"+id.trim().toLowerCase());
  const u=P.users.find(x=>x.h===h); if(!u) throw 0;
  const base=await subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const kek=await subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64(u.s),iterations:P.it},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return subtle.decrypt({name:"AES-GCM",iv:b64(u.iv)},kek,b64(u.w));
}
const f=document.getElementById("login"),err=document.getElementById("err"),go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault();err.textContent="";go.disabled=true;go.textContent="Opening…";
  try{
    const raw=await unwrap(document.getElementById("uid").value,document.getElementById("upw").value);
    if(document.getElementById("rem").checked){try{localStorage.setItem(SK,ub64(raw))}catch(_){}}
    await openWith(raw);
  }catch(_){err.textContent="Incorrect ID or password.";}
  go.disabled=false;go.textContent="Open";
});
document.getElementById("out").addEventListener("click",()=>{try{Object.keys(localStorage).filter(k=>k.startsWith("bosg-k-")).forEach(k=>localStorage.removeItem(k))}catch(_){}location.reload()});
(async()=>{let s=null;try{s=localStorage.getItem(SK)}catch(_){}
  if(s){try{await openWith(b64(s))}catch(_){try{localStorage.removeItem(SK)}catch(__){}}}})();
})();
</script>
